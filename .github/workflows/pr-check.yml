name: Privacy Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for email addresses
        run: |
          if grep -riE "@.*\.(com|org|net|io|edu)" cursorrules; then
            echo "❌ Error: Email addresses found in cursorrules"
            echo "Please remove or replace with placeholder before committing"
            exit 1
          fi
          echo "✅ No email addresses found"
      
      - name: Check for absolute user paths
        run: |
          if grep -rE "/home/[^/]+|/Users/[^/]+" cursorrules; then
            echo "❌ Error: Absolute user paths found"
            echo "Use ~/ or \$HOME instead"
            exit 1
          fi
          echo "✅ No absolute user paths found"
      
      - name: Check for API keys/tokens
        run: |
          if grep -riE "(api[_-]?key|token|secret|password)\s*[:=]" cursorrules; then
            echo "❌ Error: Potential API keys or tokens found"
            echo "Please remove before committing"
            exit 1
          fi
          echo "✅ No API keys or tokens found"
